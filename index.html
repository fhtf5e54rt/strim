<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Stream Room</title>
    <!-- Используем последнюю стабильную версию -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; color: white; height: 100vh; overflow: hidden; }

        /* --- СТРИМЕР --- */
        #hostUI { display: flex; align-items: center; justify-content: center; height: 100%; background: #1a1a1d; gap: 30px; padding: 20px; }
        
        .host-panel { background: #000; padding: 40px; border-radius: 16px; text-align: center; border: 1px solid #333; width: 400px; flex-shrink: 0; }
        .btn-start { background: #e91e63; color: white; border: none; padding: 16px 32px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%; transition: 0.2s; }
        .btn-start:hover { background: #c2185b; }
        .btn-start:disabled { background: #555; cursor: not-allowed; }
        
        .link-box { margin-top: 20px; padding: 15px; background: #1f1f23; border-radius: 8px; word-break: break-all; color: #4ade80; font-family: monospace; display: none; border: 1px solid #4ade80; font-size: 13px; }
        .kick-btn { margin-top: 15px; background: #ff3333; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; display: none; width: 100%; }
        .kick-btn:hover { background: #cc0000; }
        .status-text { margin-top: 10px; color: #888; font-size: 13px; min-height: 20px; }

        /* ПРЕВЬЮ ДЛЯ СТРИМЕРА */
        .preview-container { 
            width: 500px; aspect-ratio: 16/9; background: #000; 
            border-radius: 12px; overflow: hidden; border: 2px solid #333; 
            position: relative; display: none; 
            box-shadow: 0 0 30px rgba(233, 30, 99, 0.1);
        }
        .preview-container video { width: 100%; height: 100%; object-fit: cover; }
        .preview-label { 
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.7); padding: 4px 10px; 
            border-radius: 4px; font-size: 12px; font-weight: bold; color: #aaa;
        }

        /* --- ЗРИТЕЛЬ --- */
        #viewerUI { display: none; height: 100vh; flex-direction: row; }
        .video-section { flex: 3; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; } /* Явный черный фон */
        
        .overlay { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; pointer-events: none; z-index: 10; }
        .live-badge { background: #e91e63; padding: 5px 12px; border-radius: 4px; font-weight: bold; font-size: 13px; animation: pulse 2s infinite; }
        .viewers-badge { background: rgba(0,0,0,0.7); padding: 5px 12px; border-radius: 4px; font-size: 13px; backdrop-filter: blur(4px); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .chat-section { flex: 1; min-width: 280px; max-width: 350px; background: #18181b; display: flex; flex-direction: column; border-left: 1px solid #333; z-index: 10; }
        .chat-header { padding: 15px; border-bottom: 1px solid #333; font-weight: bold; font-size: 14px; text-align: center; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .chat-user { font-weight: bold; margin-right: 5px; }
        .c1{color:#ff4500} .c2{color:#00ff7f} .c3{color:#1e90ff} .c4{color:#ffd700} .c5{color:#ff69b4} .c6{color:#e91e63}
        
        .kicked-screen { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .kicked-screen h2 { color: #ff3333; margin-bottom: 10px; }
        .kicked-screen p { color: #aaa; }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- ПАНЕЛЬ СТРИМЕРА -->
    <div id="hostUI">
        <div class="host-panel">
            <h2 style="margin-bottom:10px;">🎥 Приватная комната</h2>
            <p style="color:#aaa;font-size:14px; margin-bottom: 20px;">Нажми кнопку, выбери OBS Virtual Camera.</p>
            <button class="btn-start" id="startBtn" onclick="startStream()">▶ Начать эфир</button>
            <div class="status-text" id="statusText"></div>
            <div class="link-box" id="streamLink"></div>
            <button class="kick-btn" id="kickBtn" onclick="kickViewer()">⛔ Кикнуть зрителя</button>
        </div>

        <div class="preview-container" id="localPreview">
            <div class="preview-label">👁 ТВОЙ ЭФИР (LOCAL)</div>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- ЭКРАН ЗРИТЕЛЯ -->
    <div id="viewerUI">
        <div class="video-section">
            <video id="remoteVideo" autoplay playsinline muted></video>
            <div class="overlay">
                <div class="live-badge">LIVE</div>
                <div class="viewers-badge">👁 <span id="viewerCount">24</span></div>
            </div>
            
            <div class="kicked-screen" id="kickedScreen">
                <h2>⛔ Трансляция окончена</h2>
                <p>Стример завершил сеанс</p>
            </div>
        </div>
        
        <div class="chat-section">
            <div class="chat-header">💬 ЧАТ ТРАНСЛЯЦИИ</div>
            <div class="chat-messages" id="chatBox"></div>
        </div>
    </div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const peerId = urlParams.get('id');
let peer, currentConn;

// === ФЕЙКОВЫЙ СЧЕТЧИК ===
let viewers = 24;
setInterval(() => {
    viewers += Math.floor(Math.random() * 5) - 2;
    if (viewers < 20) viewers = 20;
    if (viewers > 35) viewers = 35;
    document.getElementById('viewerCount').innerText = viewers;
}, 4000);

// === ФЕЙКОВЫЙ ЧАТ ===
const users = [
    {n:'MaxPro',c:'c1'},{n:'Dima_99',c:'c2'},{n:'Alex_K',c:'c3'},
    {n:'NightWolf',c:'c4'},{n:'Sergey_V',c:'c5'},{n:'Ivan_T',c:'c6'}
];
const msgs = ['Красотка! 😍','🔥🔥🔥','Топ контент','Вау!','Лайк! 👍','Огонь!','😍😍😍','Лучшая!'];

function addMsg() {
    const chat = document.getElementById('chatBox');
    const u = users[Math.floor(Math.random()*users.length)];
    const m = msgs[Math.floor(Math.random()*msgs.length)];
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `<span class="chat-user ${u.c}">${u.n}:</span> ${m}`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    if(chat.children.length > 40) chat.removeChild(chat.firstChild);
}
setInterval(addMsg, Math.random()*2500+1500);
addMsg();

// ОБЩИЕ НАСТРОЙКИ ICE (Google STUN Servers)
const iceConfig = {
    config: {
        'iceServers': [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' }
        ]
    }
};

// === ЛОГИКА СТРИМЕРА ===
async function startStream() {
    const btn = document.getElementById('startBtn');
    const status = document.getElementById('statusText');
    
    btn.disabled = true;
    btn.innerText = '⏳ Запуск...';
    
    try {
        // Захватываем поток
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 1280, height: 720 }, // Явно задаем HD
            audio: true
        });
        
        // Показываем превью
        document.getElementById('localVideo').srcObject = stream;
        document.getElementById('localPreview').style.display = 'block';
        status.innerText = 'Камера активна. Создаем ID...';

        // Создаем Peer
        peer = new Peer(null, iceConfig);

        peer.on('open', id => {
            const link = window.location.origin + window.location.pathname + '?id=' + id;
            document.getElementById('streamLink').style.display = 'block';
            document.getElementById('streamLink').innerText = link;
            
            btn.innerText = '✅ Эфир активен!';
            btn.style.background = '#2e7d32';
            status.innerText = 'Скопируйте ссылку выше.';
            document.getElementById('kickBtn').style.display = 'block';
            
            // Ждем зрителя
            peer.on('connection', conn => {
                currentConn = conn;
                status.innerText = '🟢 Зритель подключен! Отправляю видео...';
                
                conn.on('open', () => {
                    // ВАЖНО: Явный вызов с потоком
                    const call = peer.call(conn.peer, stream);
                    
                    call.on('close', () => status.innerText = '⚠️ Зритель отключился');
                    call.on('error', (err) => console.error('Call error:', err));
                });
                
                conn.on('close', () => { 
                    currentConn = null; 
                    status.innerText = 'Ожидание подключения...';
                });
            });
        });

        peer.on('error', err => {
            console.error(err);
            status.innerText = '❌ Ошибка: ' + err.type;
            btn.disabled = false;
            btn.innerText = '▶ Попробовать снова';
        });

    } catch(e) { 
        alert('Ошибка камеры! Выбери OBS Virtual Camera.');
        btn.disabled = false;
        btn.innerText = '▶ Начать эфир';
    }
}

function kickViewer() {
    if(currentConn) {
        currentConn.close();
        currentConn = null;
        document.getElementById('statusText').innerText = '⛔ Зритель кикнут!';
    } else {
        alert('Зритель не подключен');
    }
}

// === ЛОГИКА ЗРИТЕЛЯ ===
if(peerId) {
    document.getElementById('hostUI').style.display = 'none';
    document.getElementById('viewerUI').style.display = 'flex';
    
    peer = new Peer(null, iceConfig);
    
    peer.on('open', () => {
        const conn = peer.connect(peerId);
        
        conn.on('open', () => {
            // Когда соединение данных открыто, ждем видеозвонок
            peer.on('call', call => {
                // ОТВЕЧАЕМ НА ВЫЗОВ
                call.answer(); 
                
                call.on('stream', remoteStream => {
                    const vid = document.getElementById('remoteVideo');
                    vid.srcObject = remoteStream;
                    vid.muted = false; // Включаем звук
                    
                    // Дополнительная проверка: если видео все еще черное через 3 сек
                    setTimeout(() => {
                        if(vid.readyState === 0) {
                            console.warn('Видео не загрузилось, пытаемся перезапустить...');
                            vid.load();
                            vid.play();
                        }
                    }, 3000);
                });
                
                call.on('error', err => {
                    console.error('Ошибка звонка:', err);
                    document.getElementById('statusText').innerText = 'Ошибка видеопотока';
                });
            });
        });
        
        conn.on('close', () => {
            document.getElementById('kickedScreen').style.display = 'flex';
        });
        
        conn.on('error', () => {
             document.getElementById('kickedScreen').style.display = 'flex';
             document.querySelector('#kickedScreen h2').innerText = '⚠️ Ошибка соединения';
        });
    });
    
    peer.on('error', (err) => {
        if(err.type === 'peer-unavailable') {
             document.getElementById('kickedScreen').style.display = 'flex';
             document.querySelector('#kickedScreen h2').innerText = '⚠️ Стример оффлайн';
        }
    });
}
</script>
</body>
</html>
