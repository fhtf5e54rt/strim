<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Live Stream</title>
    <style>
        :root {
            --tg-bg: #17212b; --tg-header: #242f3d; --tg-text: #ffffff;
            --tg-hint: #7f91a4; --tg-accent: #5288c1; --tg-red: #e53935;
            --tg-btn: #2ea6da; --tg-green: #4caf50;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif; }
        body { background: var(--tg-bg); color: var(--tg-text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- ВИДЕО БЛОК --- */
        .video-wrapper { position: relative; width: 100%; background: #000; height: 60vh; min-height: 300px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 100%; border: none; object-fit: cover; display: none; }
        
        .start-overlay { position: absolute; inset: 0; background: rgba(23, 33, 43, 0.85); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; transition: opacity 0.3s; }
        .start-btn { background: var(--tg-btn); color: white; border: none; padding: 16px 32px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(46, 166, 218, 0.3); }
        .start-hint { margin-top: 12px; color: var(--tg-hint); font-size: 13px; }

        .overlay { position: absolute; top: 16px; left: 16px; display: flex; gap: 8px; pointer-events: none; z-index: 10; opacity: 0.3; transition: opacity 0.3s; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; backdrop-filter: blur(8px); }
        .live-badge { background: var(--tg-red); color: white; }
        .viewers-badge { background: rgba(0,0,0,0.6); color: white; display: flex; align-items: center; gap: 4px;}

        .kick-btn { position: absolute; bottom: 16px; left: 16px; background: var(--tg-red); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; z-index: 20; display: none; }
        .ended-screen { display: none; position: absolute; inset: 0; background: rgba(23, 33, 43, 0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .ended-screen h2 { color: var(--tg-hint); margin-bottom: 8px; }

        /* --- ЧАТ БЛОК --- */
        .chat-container { flex: 1; background: var(--tg-bg); display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.05); min-height: 0; }
        .chat-header { padding: 12px 16px; background: var(--tg-header); font-size: 14px; font-weight: 600; color: var(--tg-accent); border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
        
        /* Закрепленное сообщение */
        .pinned-msg { 
            background: rgba(82, 136, 193, 0.15); padding: 8px 16px; 
            font-size: 13px; color: var(--tg-accent); border-bottom: 1px solid rgba(255,255,255,0.05); 
            display: none; flex-shrink: 0; word-wrap: break-word;
        }
        .pinned-label { font-weight: bold; margin-right: 5px; opacity: 0.7; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
        .msg { font-size: 14px; line-height: 1.4; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .name { font-weight: 600; margin-right: 4px; }
        .c1{color:#e17076} .c2{color:#7bc862} .c3{color:#6ec9cb} .c4{color:#e5ca77} .c5{color:#65aadd} .c6{color:#ee7aae}

        /* --- АДМИН ПАНЕЛЬ (Модальное окно) --- */
        .admin-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 200; align-items: center; justify-content: center; padding: 20px;
        }
        .admin-content {
            background: var(--tg-header); border-radius: 16px; padding: 24px;
            width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .admin-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: var(--tg-accent); }
        .admin-group { margin-bottom: 20px; }
        .admin-label { display: block; font-size: 13px; color: var(--tg-hint); margin-bottom: 8px; }
        .admin-input, .admin-textarea { 
            width: 100%; background: var(--tg-bg); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 10px; border-radius: 8px; font-size: 14px; outline: none;
        }
        .admin-textarea { resize: vertical; min-height: 80px; }
        .admin-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .admin-btn { 
            background: var(--tg-btn); color: white; border: none; padding: 10px 16px;
            border-radius: 8px; font-weight: 600; cursor: pointer; flex: 1;
        }
        .admin-btn.green { background: var(--tg-green); }
        .admin-btn.close { background: transparent; border: 1px solid rgba(255,255,255,0.2); margin-top: 10px; }
        
        .toggle-btn { cursor: pointer; opacity: 0.6; font-size: 12px; }
        .toggle-btn:hover { opacity: 1; }

        /* Адаптив для ПК */
        @media (min-width: 768px) {
            body { flex-direction: row; }
            .video-wrapper { height: 100vh; width: 70%; max-width: 1000px; }
            .chat-container { width: 30%; min-width: 300px; max-width: 400px; border-top: none; border-left: 1px solid rgba(255,255,255,0.05); }
        }
    </style>
</head>
<body>

    <!-- ВИДЕО -->
    <div class="video-wrapper" id="videoWrap">
        <iframe id="streamFrame" allow="autoplay; camera; microphone; fullscreen"></iframe>
        <div class="start-overlay" id="startOverlay">
            <button class="start-btn" onclick="startStream()">▶ Смотреть трансляцию</button>
            <div class="start-hint">Нажмите для запуска видео и звука</div>
        </div>
        <div class="overlay" id="badges">
            <div class="badge live-badge">LIVE</div>
            <div class="badge viewers-badge">👁 <span id="viewerCount">24</span></div>
        </div>
        <button class="kick-btn" id="kickBtn" onclick="endStream()">⛔ Завершить эфир</button>
        <div class="ended-screen" id="endedScreen"><h2>Трансляция завершена</h2></div>
    </div>
    
    <!-- ЧАТ -->
    <div class="chat-container">
        <div class="chat-header">
            💬 Чат трансляции
            <span class="toggle-btn" id="adminToggle" style="display:none;">⚙️ Настройки</span>
        </div>
        <div class="pinned-msg" id="pinnedMsg">
            <span class="pinned-label">📌 Закреп:</span> <span id="pinnedText"></span>
        </div>
        <div class="chat-messages" id="chatBox"></div>
    </div>

    <!-- АДМИН ПАНЕЛЬ -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-content">
            <div class="admin-title">⚙️ Управление эфиром</div>
            
            <div class="admin-group">
                <label class="admin-label">Количество зрителей</label>
                <div class="admin-row">
                    <input type="number" class="admin-input" id="admViewers" value="24" min="0" max="9999">
                    <button class="admin-btn" onclick="updateViewers()">Применить</button>
                </div>
            </div>

            <div class="admin-group">
                <label class="admin-label">Закрепить сообщение</label>
                <div class="admin-row">
                    <input type="text" class="admin-input" id="admPin" placeholder="Текст закрепленного сообщения...">
                    <button class="admin-btn green" onclick="pinMessage()">Закрепить</button>
                </div>
            </div>

            <div class="admin-group">
                <label class="admin-label">Быстрое сообщение в чат</label>
                <div class="admin-row">
                    <input type="text" class="admin-input" id="admQuickMsg" placeholder="Написать от имени бота...">
                    <button class="admin-btn" onclick="sendQuickMsg()">Отправить</button>
                </div>
            </div>

            <div class="admin-group">
                <label class="admin-label">Список ников (через запятую)</label>
                <textarea class="admin-textarea" id="admNicks" placeholder="Алексей, Мария, Дмитрий, Ольга..."></textarea>
                <button class="admin-btn" style="margin-top:8px;" onclick="updateNicks()">Обновить ники</button>
            </div>

            <div class="admin-group">
                <label class="admin-label">Сообщения ботов (через запятую)</label>
                <textarea class="admin-textarea" id="admMsgs" placeholder="Красотка, Огонь, Топ контент..."></textarea>
                <button class="admin-btn" style="margin-top:8px;" onclick="updateMsgs()">Обновить фразы</button>
            </div>

            <button class="admin-btn close" onclick="closeAdmin()">Закрыть панель</button>
        </div>
    </div>

<script>
    // === КОНФИГУРАЦИЯ И СОСТОЯНИЕ ===
    const isHost = new URLSearchParams(window.location.search).get('host') === 'true';
    if(isHost) {
        document.getElementById('kickBtn').style.display = 'block';
        document.getElementById('adminToggle').style.display = 'inline';
    }

    // Данные по умолчанию
    let currentViewers = 24;
    let nicks = ['Алексей', 'Мария', 'Дмитрий', 'Ольга', 'Сергей', 'Анна', 'Максим', 'Елена', 'Иван', 'Катя'];
    let botMsgs = ['Красотка! 😍','🔥🔥🔥','Топ контент','Вау!','Лайк! 👍','Огонь!','😍😍','Лучшая!','Шикарные движения','Залипательно','Когда еще эфир?','Подписался!'];
    
    // История последних сообщений для предотвращения повторов
    let lastUserMsg = {}; 
    let lastGlobalMsg = '';

    // === ФЕЙКОВЫЙ СЧЕТЧИК ===
    setInterval(() => {
        currentViewers += Math.floor(Math.random() * 5) - 2;
        if(currentViewers < 20) currentViewers = 20; 
        if(currentViewers > 35) currentViewers = 35;
        document.getElementById('viewerCount').innerText = currentViewers;
    }, 4000);

    // === УМНЫЙ ФЕЙКОВЫЙ ЧАТ ===
    function addMsg(forceUser = null, forceText = null) {
        const chat = document.getElementById('chatBox');
        
        // Выбор пользователя
        let user;
        if (forceUser) {
            user = { n: forceUser, c: 'c' + (Math.floor(Math.random()*6)+1) };
        } else {
            const nick = nicks[Math.floor(Math.random() * nicks.length)];
            // Проверка на повтор того же юзера подряд
            if (lastUserMsg['global'] === nick && Math.random() > 0.3) return addMsg(); 
            lastUserMsg['global'] = nick;
            user = { n: nick, c: 'c' + (Math.floor(Math.random()*6)+1) };
        }

        // Выбор сообщения
        let msg;
        if (forceText) {
            msg = forceText;
        } else {
            msg = botMsgs[Math.floor(Math.random() * botMsgs.length)];
            // Проверка на глобальный повтор сообщения
            if (lastGlobalMsg === msg && Math.random() > 0.2) return addMsg();
            lastGlobalMsg = msg;
        }

        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="name ${user.c}">${user.n}:</span> ${msg}`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        if(chat.children.length > 60) chat.removeChild(chat.firstChild);
    }

    // Запуск авто-чата
    let chatInterval = setInterval(() => addMsg(), Math.random()*2500+1500);
    addMsg();

    // === ЗАПУСК ПОТОКА ===
    function startStream() {
        document.getElementById('streamFrame').src = "https://vdo.ninja/?view=jihmLV5&autoplay=1&cleanoutput=1&ad=0";
        document.getElementById('streamFrame').style.display = 'block';
        const overlay = document.getElementById('startOverlay');
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 300);
        document.getElementById('badges').style.opacity = '1';
    }

    // === ЛОГИКА КИКА ===
    function endStream() {
        document.getElementById('endedScreen').style.display = 'flex';
        document.getElementById('streamFrame').style.display = 'none';
        const btn = document.getElementById('kickBtn');
        btn.innerText = '✅ Эфир завершен'; btn.disabled = true; btn.style.opacity = '0.5';
    }

    // === АДМИН ПАНЕЛЬ ===
    const adminModal = document.getElementById('adminModal');
    document.getElementById('adminToggle').onclick = () => {
        // Заполняем поля текущими значениями при открытии
        document.getElementById('admViewers').value = currentViewers;
        document.getElementById('admNicks').value = nicks.join(', ');
        document.getElementById('admMsgs').value = botMsgs.join(', ');
        adminModal.style.display = 'flex';
    };
    function closeAdmin() { adminModal.style.display = 'none'; }

    function updateViewers() {
        const val = parseInt(document.getElementById('admViewers').value);
        if(!isNaN(val)) { currentViewers = val; document.getElementById('viewerCount').innerText = val; }
    }

    function pinMessage() {
        const text = document.getElementById('admPin').value.trim();
        const pinBlock = document.getElementById('pinnedMsg');
        if(text) {
            document.getElementById('pinnedText').innerText = text;
            pinBlock.style.display = 'block';
        } else {
            pinBlock.style.display = 'none';
        }
    }

    function sendQuickMsg() {
        const text = document.getElementById('admQuickMsg').value.trim();
        if(text) {
            addMsg('Администратор', text); // Отправляем от специального имени
            document.getElementById('admQuickMsg').value = '';
        }
    }

    function updateNicks() {
        const raw = document.getElementById('admNicks').value;
        const arr = raw.split(',').map(s => s.trim()).filter(s => s.length > 0);
        if(arr.length > 0) nicks = arr;
    }

    function updateMsgs() {
        const raw = document.getElementById('admMsgs').value;
        const arr = raw.split(',').map(s => s.trim()).filter(s => s.length > 0);
        if(arr.length > 0) botMsgs = arr;
    }
</script>
</body>
</html>
