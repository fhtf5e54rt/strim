<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Stream Room - Investor Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; color: white; height: 100vh; overflow: hidden; }

        /* Основной контейнер */
        .main-container { display: flex; height: 100vh; width: 100%; }
        
        /* Секция видео */
        .video-section { 
            flex: 3; 
            position: relative; 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        /* Iframe VDO.Ninja растягиваем на весь блок */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            object-fit: cover; 
        }

        /* Оверлеи поверх видео */
        .overlay { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            display: flex; 
            gap: 10px; 
            pointer-events: none; 
            z-index: 10;
        }
        .live-badge { 
            background: #e91e63; 
            padding: 5px 12px; 
            border-radius: 4px; 
            font-weight: bold; 
            font-size: 13px; 
            animation: pulse 2s infinite; 
        }
        .viewers-badge { 
            background: rgba(0,0,0,0.7); 
            padding: 5px 12px; 
            border-radius: 4px; 
            font-size: 13px; 
            backdrop-filter: blur(4px); 
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        /* Кнопка кика (видна только стримеру) */
        .kick-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 20;
            display: none; /* Скрыта по умолчанию */
        }
        .kick-btn {
            background: #ff3333; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .kick-btn:hover { background: #cc0000; }

        /* Секция чата */
        .chat-section { 
            flex: 1; 
            min-width: 280px; 
            max-width: 350px; 
            background: #18181b; 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid #333; 
        }
        .chat-header { 
            padding: 15px; 
            border-bottom: 1px solid #333; 
            font-weight: bold; 
            font-size: 14px; 
            text-align: center; 
        }
        .chat-messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        .chat-msg { font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .chat-user { font-weight: bold; margin-right: 5px; }
        
        /* Цвета ников */
        .c1{color:#ff4500} .c2{color:#00ff7f} .c3{color:#1e90ff} 
        .c4{color:#ffd700} .c5{color:#ff69b4} .c6{color:#e91e63}

        /* Экран блокировки (после кика) */
        .blocked-screen { 
            display: none; 
            position: absolute; 
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
        }
        .blocked-screen h2 { color: #ff3333; margin-bottom: 10px; }
        .blocked-screen p { color: #aaa; }

        /* Скроллбар */
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    </style>
</head>
<body>

<div class="main-container">
    <!-- ВИДЕО СЕКЦИЯ -->
    <div class="video-section" id="videoContainer">
        <!-- ВСТАВЛЯЕМ ТВОЮ ССЫЛКУ VDO.NINJA -->
        <iframe 
            src="https://vdo.ninja/?view=jihmLV5&autoplay=1&cleanoutput=1" 
            allow="autoplay; camera; microphone; fullscreen"
            title="Stream Feed">
        </iframe>

        <!-- ФЕЙКОВЫЕ БЕЙДЖИ -->
        <div class="overlay">
            <div class="live-badge">LIVE</div>
            <div class="viewers-badge">👁 <span id="viewerCount">24</span></div>
        </div>

        <!-- КНОПКА КИКА (Для стримера) -->
        <div class="kick-overlay" id="kickPanel">
            <button class="kick-btn" onclick="endStream()">⛔ Завершить эфир</button>
        </div>

        <!-- ЭКРАН БЛОКИРОВКИ (Для зрителя после кика) -->
        <div class="blocked-screen" id="blockedScreen">
            <h2>⛔ Трансляция окончена</h2>
            <p>Стример завершил сеанс</p>
        </div>
    </div>
    
    <!-- ЧАТ СЕКЦИЯ -->
    <div class="chat-section">
        <div class="chat-header">💬 ЧАТ ТРАНСЛЯЦИИ</div>
        <div class="chat-messages" id="chatBox"></div>
    </div>
</div>

<script>
    // === ПАРАМЕТРЫ ДЕМО ===
    // Если ты стример, добавь ?host=true в конец ссылки сайта
    const isHost = new URLSearchParams(window.location.search).get('host') === 'true';

    // Показываем кнопку кика только если ты зашел как хост
    if(isHost) {
        document.getElementById('kickPanel').style.display = 'block';
    }

    // === ФЕЙКОВЫЙ СЧЕТЧИК (20-35 чел) ===
    let viewers = 24;
    setInterval(() => {
        viewers += Math.floor(Math.random() * 5) - 2;
        if (viewers < 20) viewers = 20;
        if (viewers > 35) viewers = 35;
        document.getElementById('viewerCount').innerText = viewers;
    }, 4000);

    // === ФЕЙКОВЫЙ ЧАТ (Комплименты) ===
    const users = [
        {n:'MaxPro',c:'c1'},{n:'Dima_99',c:'c2'},{n:'Alex_K',c:'c3'},
        {n:'NightWolf',c:'c4'},{n:'Sergey_V',c:'c5'},{n:'Ivan_T',c:'c6'},
        {n:'CoolGuy',c:'c1'},{n:'Denis_M',c:'c2'}
    ];
    const msgs = [
        'Красотка! 😍','🔥🔥🔥','Топ контент','Вау!',
        'Как же красиво','Лайк! 👍','Огонь!','😍😍😍',
        'Лучшая!','Когда еще эфир?','Подписался!','Шикарные движения',
        '❤️❤️','Нереально круто','Залипательно','Танцуй еще!'
    ];

    function addMsg() {
        const chat = document.getElementById('chatBox');
        const u = users[Math.floor(Math.random()*users.length)];
        const m = msgs[Math.floor(Math.random()*msgs.length)];
        const div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `<span class="chat-user ${u.c}">${u.n}:</span> ${m}`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        if(chat.children.length > 40) chat.removeChild(chat.firstChild);
    }
    
    // Запускаем чат с разной скоростью
    setInterval(addMsg, Math.random()*2500+1500);
    addMsg(); // Первое сообщение сразу

    // === ЛОГИКА КИКА ===
    function endStream() {
        // Показываем экран "Трансляция окончена"
        document.getElementById('blockedScreen').style.display = 'flex';
        // Скрываем iframe (чтобы звук тоже пропал)
        document.querySelector('iframe').style.display = 'none';
        // Меняем текст кнопки
        document.querySelector('.kick-btn').innerText = '✅ Эфир завершен';
        document.querySelector('.kick-btn').disabled = true;
        document.querySelector('.kick-btn').style.background = '#555';
    }
</script>
</body>
</html>
