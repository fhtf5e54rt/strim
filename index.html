<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Stream Test</title>
    <style>
        :root { --bg:#0e1621; --header:#17212b; --txt:#fff; --hint:#708499; --acc:#5288c1; --red:#ff3b30; --green:#4caf50; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Roboto',sans-serif; }
        body { background:var(--bg); color:var(--txt); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
        
        .video-wrapper { position:relative; width:100%; background:#000; flex:1; min-height:50vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        iframe { width:100%; height:100%; border:none; object-fit:fill; display:none; } 
        
        /* Экраны состояний */
        .overlay-screen { position:absolute; inset:0; background:rgba(14,22,33,0.98); backdrop-filter:blur(20px); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; text-align:center; padding:20px; transition:opacity .3s; }
        .start-btn, .pay-btn { background:var(--acc); color:white; border:none; padding:14px 28px; border-radius:50px; font-size:15px; font-weight:600; cursor:pointer; box-shadow:0 4px 20px rgba(82,136,193,.4); margin-top:15px; text-decoration:none; display:inline-block;}
        .pay-btn { background:var(--green); }
        .title { font-size:22px; font-weight:bold; margin-bottom:10px; }
        .desc { color:var(--hint); font-size:14px; max-width:300px; line-height:1.5; }
        
        /* Бейджи */
        .top-overlay { position:absolute; top:12px; left:12px; display:flex; gap:6px; pointer-events:none; z-index:10; opacity:0; transition:opacity .5s; }
        .badge { padding:4px 8px; border-radius:4px; font-size:12px; font-weight:700; backdrop-filter:blur(4px); }
        .live-badge { background:var(--red); color:white; }
        
        /* Чат */
        .chat-container { height:45%; background:var(--bg); display:flex; flex-direction:column; border-top:1px solid rgba(255,255,255,.05); flex-shrink:0; }
        .chat-header { padding:10px 16px; background:var(--header); font-size:13px; font-weight:600; color:var(--acc); border-bottom:1px solid rgba(255,255,255,.05); display:flex; justify-content:space-between; align-items:center; }
        .chat-messages { flex:1; overflow-y:auto; padding:10px 16px; display:flex; flex-direction:column; gap:6px; mask-image:linear-gradient(to bottom,transparent,black 10%); }
        .msg { font-size:14px; line-height:1.35; word-wrap:break-word; animation:slideUp .3s ease; }
        @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .name { font-weight:600; margin-right:4px; }
        .c1{color:#ff5e5e} .c2{color:#5eff8a} .c3{color:#5eeaff} .c4{color:#ffeb5e} .c5{color:#5e9aff}

        .input-area { padding:8px 12px; background:var(--header); display:flex; flex-direction:column; gap:6px; }
        .row { display:flex; gap:8px; }
        input { background:var(--bg); border:1px solid rgba(255,255,255,.1); color:white; padding:8px 12px; border-radius:18px; font-size:14px; outline:none; }
        .nick-in { width:100%; background:transparent; border:none; color:var(--hint); font-size:12px; border-bottom:1px solid rgba(255,255,255,.05); border-radius:0; padding:4px 12px;}
        .send-btn { background:var(--acc); color:white; border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; }

        @media(min-width:768px){ 
            body{flex-direction:row} 
            .video-wrapper{height:100vh;width:70%;max-width:1000px} 
            .chat-container{height:100vh;width:30%;min-width:300px;max-width:400px;border-top:none;border-left:1px solid rgba(255,255,255,.05)} 
            iframe{object-fit:contain} 
        }
    </style>
</head>
<body>
    <div class="video-wrapper">
        <!-- ТВОЯ ССЫЛКА НА VDO.NINJA -->
        <iframe id="streamFrame" src="" allow="autoplay;camera;microphone;fullscreen"></iframe>
        
        <!-- Экран старта -->
        <div class="overlay-screen" id="startScreen">
            <div class="title">🔴 Приватная трансляция</div>
            <div class="desc">Добро пожаловать. У вас есть 30 секунд бесплатного просмотра.</div>
            <button class="start-btn" onclick="joinStream()">▶ Войти на эфир</button>
        </div>

        <!-- Экран Paywall (Блокировка) -->
        <div class="overlay-screen" id="paywallScreen" style="display:none;">
            <div class="title">🔒 Стример ушел в приват</div>
            <div class="desc">Бесплатное время вышло. Для продолжения просмотра необходимо оплатить вход.</div>
            <a href="#" class="pay-btn" onclick="simulatePayment()">💎 Оплатить вход (99₽)</a>
        </div>

        <div class="top-overlay" id="badges">
            <div class="badge live-badge">LIVE</div>
        </div>
    </div>
    
    <div class="chat-container">
        <div class="chat-header">
            <span>💬 Чат</span>
            <span id="timerDisplay" style="font-size:11px;opacity:0.6;"></span>
        </div>
        <div class="chat-messages" id="chatBox"></div>
        <div class="input-area">
            <input type="text" class="nick-in" id="userNick" placeholder="Ваш никнейм" maxlength="15">
            <div class="row">
                <input type="text" style="flex:1" id="userMsg" placeholder="Сообщение..." maxlength="100">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

<script>
    // КОНСТАНТЫ
    const VDO_LINK = "https://vdo.ninja/?view=jihmLV5&autoplay=1&cleanoutput=1&ad=0";
    const FREE_TIME = 30; // Секунды
    
    let sessionId = localStorage.getItem('test_sid');
    if (!sessionId) {
        sessionId = crypto.randomUUID();
        localStorage.setItem('test_sid', sessionId);
    }

    // Проверка статуса при загрузке
    window.onload = () => {
        const status = localStorage.getItem('test_status');
        if (status === 'blocked') {
            showPaywall();
        } else if (status === 'paid') {
            unlockStream();
        } else {
            document.getElementById('startScreen').style.display = 'flex';
        }
        runBots();
        
        // Восстановление ника
        const savedNick = localStorage.getItem('test_nick');
        if(savedNick) document.getElementById('userNick').value = savedNick;
    };

    function joinStream() {
        document.getElementById('startScreen').style.display = 'none';
        startVideo();
        startTimer(FREE_TIME);
    }

    function startVideo() {
        const f = document.getElementById('streamFrame');
        f.src = VDO_LINK;
        f.style.display = 'block';
        document.getElementById('badges').style.opacity = '1';
    }

    function startTimer(sec) {
        let s = sec;
        const el = document.getElementById('timerDisplay');
        const int = setInterval(() => {
            s--; 
            el.innerText = `Осталось: ${s}с`;
            if(s <= 0) { 
                clearInterval(int); 
                el.innerText = ''; 
                lockStream(); 
            }
        }, 1000);
    }

    function lockStream() {
        document.getElementById('streamFrame').style.display = 'none';
        document.getElementById('paywallScreen').style.display = 'flex';
        localStorage.setItem('test_status', 'blocked');
    }

    function showPaywall() {
        document.getElementById('streamFrame').style.display = 'none';
        document.getElementById('paywallScreen').style.display = 'flex';
        document.getElementById('badges').style.opacity = '0.3';
    }

    // Имитация оплаты для теста
    function simulatePayment() {
        if(confirm('Тестовый режим: Имитировать успешную оплату?')) {
            localStorage.setItem('test_status', 'paid');
            unlockStream();
            render('Система', '💎 Доступ успешно активирован!', 'c4');
        }
    }

    function unlockStream() {
        document.getElementById('paywallScreen').style.display = 'none';
        document.getElementById('streamFrame').style.display = 'block';
        document.getElementById('badges').style.opacity = '1';
        document.getElementById('timerDisplay').innerText = '✅ Доступ активен';
        if(!document.getElementById('streamFrame').src) startVideo();
    }

    // Чат и боты
    const bots = [{n:'Алексей',c:'c1'},{n:'Дмитрий',c:'c2'},{n:'Сергей',c:'c3'}];
    const msgs = ['Хочу в приват','Ответь в тг','Приезжай ко мне в спб','Я тебе отправил кеш','Проверь смс в тг'];
    
    function runBots() {
        setTimeout(()=>{
            const b = bots[Math.floor(Math.random()*bots.length)];
            const m = msgs[Math.floor(Math.random()*msgs.length)];
            render(b.n, m, b.c);
            runBots();
        }, Math.random()*4000+2000);
    }

    function sendMsg() {
        const n = document.getElementById('userNick').value.trim() || 'Аноним';
        const t = document.getElementById('userMsg').value.trim();
        if(!t) return;
        localStorage.setItem('test_nick', n);
        render(n, t, 'c5');
        document.getElementById('userMsg').value = '';
    }
    document.getElementById('userMsg').onkeypress = e => { if(e.key==='Enter') sendMsg(); };

    function render(n,t,c) {
        const d = document.createElement('div'); d.className='msg';
        d.innerHTML = `<span class="name ${c}">${n}:</span> ${t}`;
        const box = document.getElementById('chatBox'); box.appendChild(d); box.scrollTop=box.scrollHeight;
        if(box.children.length>50) box.removeChild(box.firstChild);
    }
</script>
</body>
</html>
